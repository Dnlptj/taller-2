<h2 class="mb-4">Productos</h2>

<app-producto-form (productoAgregado)="onProductoAgregado($event)"></app-producto-form>

<ul class="list-group">
  <li *ngFor="let p of productos$ | async"
      class="list-group-item d-flex justify-content-between align-items-center">
    <span>
      <strong>{{ p.nombre }}</strong> — {{ p.descripcion }}
    </span>
    <span class="d-flex align-items-center gap-2">
      <span class="badge bg-secondary">{{ p.votos }} votos</span>
      <button class="btn btn-sm btn-success" (click)="votar(p.id, true)">+1</button>
      <button class="btn btn-sm btn-danger" (click)="votar(p.id, false)">-1</button>
      <button class="btn btn-sm btn-outline-dark" (click)="eliminar(p.id)">Eliminar</button>
    </span>
  </li>
</ul>
